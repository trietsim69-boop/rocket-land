<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rocket Land app screen</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B18}
a{color:#5CC8FF}a:hover{color:#9FE3FF}

</helmet>

<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="-30 -30 60 60" aria-hidden="true">
<rect x="-30" y="-30" width="60" height="60" rx="14" fill="#0F1630" stroke="#223058"></rect>
<path d="M-5,8 Q0,26 5,8 Z" fill="#FFB547"></path>
<line x1="-8" y1="5" x2="-16" y2="16" stroke="#9AA6BD" stroke-width="2.5" stroke-linecap="round"></line>
<line x1="8" y1="5" x2="16" y2="16" stroke="#9AA6BD" stroke-width="2.5" stroke-linecap="round"></line>
<polygon points="-9,-12 -12,0 -12,7 12,7 12,0 9,-12" fill="#E8ECF4"></polygon>
<circle cx="0" cy="-4" r="3.5" fill="#1B2A4A" stroke="#5CC8FF" stroke-width="1.2"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Rocket Land</h1>
<p style="margin: 0; font-size: 15px; color: #9AA6C4">Click the sky, pick a reward, and watch a trained agent land.</p>
</div>
</div>
<a href="#rewards" style="font-size: 15px; padding: 12px 4px">What do the rewards mean?</a>
</header>

<fieldset id="rewards" style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA6C4; padding: 0; margin-bottom: 10px">Agent · training reward</legend>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<label style="flex: 1 1 220px; display: flex; gap: 12px; padding: 16px; border-radius: 12px; border: 1.5px solid #5CC8FF; background: #122045; cursor: pointer">
<input type="radio" name="agent" checked="checked" style="accent-color: #5CC8FF; width: 18px; height: 18px; margin: 2px 0 0 0">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 600; font-size: 17px">pbrs</span>
<span style="font-size: 13px; color: #B7C2DC; line-height: 1.4">Potential-based shaping: sparse + γΦ(s′) − Φ(s)</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5CC8FF; margin-top: 4px">84% land in zone</span>
</span>
</label>
<label style="flex: 1 1 220px; display: flex; gap: 12px; padding: 16px; border-radius: 12px; border: 1px solid #223058; background: #0F1630; cursor: pointer">
<input type="radio" name="agent" style="accent-color: #5CC8FF; width: 18px; height: 18px; margin: 2px 0 0 0">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 600; font-size: 17px">default</span>
<span style="font-size: 13px; color: #9AA6C4; line-height: 1.4">The env’s built-in reward</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA6C4; margin-top: 4px">94% land in zone</span>
</span>
</label>
<label style="flex: 1 1 220px; display: flex; gap: 12px; padding: 16px; border-radius: 12px; border: 1px solid #223058; background: #0F1630; cursor: pointer">
<input type="radio" name="agent" style="accent-color: #5CC8FF; width: 18px; height: 18px; margin: 2px 0 0 0">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 600; font-size: 17px">sparse</span>
<span style="font-size: 13px; color: #9AA6C4; line-height: 1.4">Only ±100 at the end, plus fuel cost</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA6C4; margin-top: 4px">84% land in zone</span>
</span>
</label>
<label style="flex: 1 1 220px; display: flex; gap: 12px; padding: 16px; border-radius: 12px; border: 1px solid #223058; background: #0F1630; cursor: pointer">
<input type="radio" name="agent" style="accent-color: #5CC8FF; width: 18px; height: 18px; margin: 2px 0 0 0">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 600; font-size: 17px">hack</span>
<span style="font-size: 13px; color: #9AA6C4; line-height: 1.4">Sparse + a naive “stay near the pad” bonus</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA6C4; margin-top: 4px">97% land in zone</span>
</span>
</label>
</div>
</fieldset>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<p style="margin: 0; font-size: 16px; color: #E6EAF5"><strong style="color: #5CC8FF">pbrs</strong> is descending from (−0.17, 1.21). Main engine on.</p>
<div style="display: flex; gap: 10px; align-items: center">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #223058; background: #0F1630; color: #E6EAF5; font: 500 15px 'Space Grotesk', sans-serif; cursor: pointer">

</div>
</div>
</div>
